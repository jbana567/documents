      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');

  font-family: 'Poppins', sans-serif;
  font-size: 84px;
  font-weight: 700;
  letter-spacing: -0.024em;
  line-height: 1;

  /* navy up to 53%, blue after it, with no blending in between */
  background: linear-gradient(90deg, #0b1b4d 0 53%, #0b63f6 53% 100%);

  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;

  display: inline-block; /* so the gradient fits the text width */
}
